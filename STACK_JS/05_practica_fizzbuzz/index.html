<body>
    <div class="contenedor">
        <h1>Fizzbuzz</h1>
        <div class="card">
            <h2>Regla fizzbuzz</h2>
            <ul>
                <li>si un numero es divisible por 3, muestra "fizz"</li>
                <li>si un numero es divisible por 5; muestra "buzz"</li>
                <li>si un numero es divisible por ambos 3 y 5, muestra "fizzbuzz"</li>
                <li>si no cumple ninguna de estas condiciones, muestra el número tal cual</li>
            </ul>
            <button onclick="fizzbuzz()">Ejecutar</button>
        </div>
    <script src="static/js/script.js"></script>
