<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de usuarios (CORE)</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header class="barra-navegación">
        <div class="logotipo">Social Blog</div>
        <div class="barra-busqueda">
            <p class="espacio">Buscar publicaciones...</p>
            <input type="text" class="espacio">
        </div>
        <div class="nav">
            <button class="button hover">Iniciar sesion</button>
        </div>
    </header>

    <main class="contenedor-principal">
        <section class="columna-izquierda">
            <div class="tarjeta-conexiones">
                <h2>Fundamentos de JavasScript</h2>
            </div>

            <div class="tarjeta-conexiones-2">
                <h2>Aprende a diseñar con JS</h2>
            </div>
        </section>

        <section class="columna-derecha">
            <div class="caja">
                <div class="descripcion-tarjeta">
                    <h2 class="algo">¡Bienvenido!</h1>
                    <h3 class="algo">Explora nuevas publicaciones y conecta</h2>
                    <h3 class="algo">con otros usuarios</h3>
                    <div class="boton2">
                        <button class="perfil" id="verPerfil">Ver perfil</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
